name: CI — PR Validation

on:
  pull_request:
    branches: [main, master]

env:
  SF_PACKAGE_DIR: force-app

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Create Scratch Org
        run: |
          sf org create scratch \
            --definition-file config/project-scratch-def.json \
            --alias pr-ci-org \
            --duration-days 1 \
            --set-default

      - name: Authenticate to Dev Hub
        run: |
          echo '${{ secrets.SF_JWT_KEY }}' > jwt_key
          sf org jwt grant \
            --client-id ${{ secrets.SF_JWT_CLIENT_ID }} \
            --jwt-key-file jwt_key \
            --username ${{ secrets.SF_DEV_HUB_USERNAME }} \
            --alias DevHub \
            --set-default-dev-hub
          rm jwt_key

      - name: Deploy metadata to Scratch Org
        run: |
          sf project deploy start \
            --source-dir ${{ env.SF_PACKAGE_DIR }} \
            --target-org pr-ci-org

      - name: Run Apex tests
        run: |
          sf apex run test \
            --target-org pr-ci-org \
            --test-level RunAllTests \
            --result-format human --json

      - name: Delete Scratch Org
        if: always()
        run: |
          sf org delete scratch \
            --target-org pr-ci-org \
            --no-prompt
