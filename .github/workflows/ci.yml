name: CI — PR Validation

on:
  pull_request:
    branches: [main, master, qa]

env:
  SF_PACKAGE_DIR: force-app

jobs:
  # Cheapest checks first: lint + LWC unit tests run on every PR, no org
  # round-trip and no secrets required. This job can never be silently
  # skipped — a failure here blocks the PR.
  lint-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests (Jest)
        run: npm test

  # Org round-trip: only runs after lint/tests pass. A missing SFDX_AUTH_URL
  # fails this job loudly instead of silently skipping validation.
  validate-salesforce:
    needs: lint-and-unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require SFDX_AUTH_URL
        run: |
          if [ -z "${{ secrets.SFDX_AUTH_URL }}" ]; then
            echo "::error::SFDX_AUTH_URL secret is not set. CI cannot authenticate to the dev org, so this PR cannot be validated. Configure the SFDX_AUTH_URL repository secret (see docs/CI_CD_SECRETS.md) and re-run."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Dev Org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > ./auth.txt
          sf org login sfdx-url -f ./auth.txt -a ci-org -s
          rm -f ./auth.txt

      - name: Validate metadata + run relevant tests (dry run)
        run: |
          sf project deploy start \
            --source-dir ${{ env.SF_PACKAGE_DIR }} \
            --target-org ci-org \
            --dry-run \
            --test-level RunRelevantTests

      # NOTE: No separate "RunLocalTests" step — the dry-run deploy above
      # already runs RunRelevantTests (tests for the deployed code only).
      # The org has pre-existing unrelated test classes (e.g.,
      # DataManager_QuotaTest) that depend on org-specific Documents.
      # RunRelevantTests avoids tripping on those while still blocking
      # PRs that fail to deploy or break relevant tests.

      # OPTION C NOTE: scratch-org integration stage intentionally removed.
      # Restore when Dev Hub is enabled + JWT secrets configured:
      #   sf org create scratch -f config/project-scratch-def.json -a ci-org -d 7
      #   sf project deploy start --target-org ci-org --source-dir force-app
      #   sf apex run test --target-org ci-org --test-level RunLocalTests --code-coverage
      #   sf org delete scratch --target-org ci-org --no-prompt -p

      # Playwright E2E smoke suite — gate 2's browser-level check. It reuses the
      # ci-org session authenticated above (the frontdoor session is derived from
      # the CLI's access token); no Salesforce password or security token is ever
      # read here. See playwright/global-setup.ts and
      # playwright/support/salesforceSession.ts.
      #
      # The pretest:e2e npm script runs `playwright install --with-deps chromium`,
      # so the runner gets Chromium plus the system libraries it needs.
      - name: Install npm dependencies
        run: npm ci

      - name: Run Playwright E2E smoke suite
        env:
          SF_TARGET_ORG: ci-org
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 14

  # DO NOT DELETE without updating branch protection.
  #
  # Branch protection on `main` requires a status check named literally
  # "validate-and-test". This PR splits that single job into
  # `lint-and-unit-test` + `validate-salesforce`, which means the required
  # context would never be reported — and GitHub treats a required check
  # that is never reported as "expected/pending", permanently blocking
  # every merge (even with all real checks green).
  #
  # This shim re-reports the required context name. It must use
  # `if: always()`: a *skipped* job's required check also stays pending
  # forever, so the shim has to run and decide, not be skipped.
  validate-and-test:
    needs: [lint-and-unit-test, validate-salesforce]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on upstream job results
        run: |
          echo "lint-and-unit-test : ${{ needs.lint-and-unit-test.result }}"
          echo "validate-salesforce: ${{ needs.validate-salesforce.result }}"
          if [ "${{ needs.lint-and-unit-test.result }}" != "success" ] || \
             [ "${{ needs.validate-salesforce.result }}" != "success" ]; then
            echo "::error::Upstream CI jobs did not all succeed — blocking merge."
            exit 1
          fi
          echo "All upstream checks passed."
