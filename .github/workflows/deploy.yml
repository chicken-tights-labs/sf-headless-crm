name: CD — Deploy to Dev Org

on:
  # Auto-deploy on every merge to main. workflow_dispatch kept for a manual
  # re-run (e.g. retrying a transient org-side failure without a new commit).
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy to the dev org at a time; queue instead of cancelling a
# running deploy so a fast second merge can't race the first one's rollout.
concurrency:
  group: deploy-dev-org
  cancel-in-progress: false

permissions:
  contents: read

env:
  SF_PACKAGE_DIR: force-app

jobs:
  deploy-to-dev-org:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require SFDX_AUTH_URL
        run: |
          if [ -z "${{ secrets.SFDX_AUTH_URL }}" ]; then
            echo "::error::SFDX_AUTH_URL secret is not set. Cannot authenticate to the dev org, so this deploy cannot proceed. Configure the SFDX_AUTH_URL repository secret (see docs/CI_CD_SECRETS.md) and re-run."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Dev Org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > ./auth.txt
          sf org login sfdx-url -f ./auth.txt -a dev-org -s
          rm -f ./auth.txt

      - name: Deploy metadata to Dev Org
        run: |
          sf project deploy start \
            --source-dir ${{ env.SF_PACKAGE_DIR }} \
            --target-org dev-org \
            --test-level RunRelevantTests \
            --json

      # RunRelevantTests (not RunLocalTests): org-wide coverage is 64% and
      # one test is flaky — full-suite deploys would fail on pre-existing
      # noise. Switch once coverage is above 75%.
      - name: Post-deploy smoke check
        run: |
          set -euo pipefail

          echo "Verifying dev org is reachable post-deploy..."
          sf org display --target-org dev-org --json > org-display.json
          jq -e '.status == 0' org-display.json > /dev/null || {
            echo "::error::Smoke check failed: dev-org is not reachable after deploy ${{ github.sha }}. The deploy may have left the org in a bad auth/connection state."
            exit 1
          }

          echo "Verifying a core custom object is queryable post-deploy..."
          sf data query --target-org dev-org \
            -q "SELECT COUNT() FROM Waiver_Record__c" \
            --json > waiver-query.json
          jq -e '.status == 0' waiver-query.json > /dev/null || {
            echo "::error::Smoke check failed: Waiver_Record__c is not queryable after deploy ${{ github.sha }}. Treat this deploy as broken and investigate before trusting the dev org."
            exit 1
          }

          echo "Smoke check passed for ${{ github.sha }}."

      - name: Install npm dependencies
        run: npm ci

      # Full Playwright regression suite — runs after every deploy, not just
      # on PRs, so a deploy that breaks a previously-merged story is caught
      # even though gate 2 already passed on its own PR. Same frontdoor-session
      # auth as ci.yml; no password or security token involved.
      - name: Run Playwright E2E regression suite
        env:
          SF_TARGET_ORG: dev-org
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-post-deploy
          path: playwright/playwright-report/
          retention-days: 14
