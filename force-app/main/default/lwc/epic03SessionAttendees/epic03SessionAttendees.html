<template>
  <lightning-card title="Attendees" icon-name="standard:people">
    <div class="slds-p-horizontal_medium slds-p-bottom_small">
      <p class="slds-text-body_small slds-m-bottom_small">{countLabel}</p>

      <template if:true={error}>
        <p class="slds-text-color_error" role="alert">{error}</p>
      </template>

      <template if:true={actionError}>
        <p class="slds-text-color_error slds-m-bottom_small" role="alert">
          {actionError}
        </p>
      </template>

      <template if:true={isEmpty}>
        <p>No bookings for this session yet.</p>
      </template>

      <template if:true={hasRows}>
        <lightning-datatable
          key-field="bookingId"
          data={attendees}
          columns={columns}
          hide-checkbox-column
          onrowaction={handleRowAction}
        ></lightning-datatable>
      </template>

      <div class="slds-m-top_medium">
        <lightning-input
          type="tel"
          label="Phone"
          autocomplete="tel"
          value={phoneInput}
          onchange={handlePhoneChange}
        ></lightning-input>
        <lightning-button
          class="slds-m-top_x-small"
          label="Find"
          onclick={handleFind}
          disabled={finding}
        ></lightning-button>

        <template if:true={phoneMessage}>
          <p class="slds-m-top_x-small" role="status">{phoneMessage}</p>
        </template>

        <template if:true={hasPhoneMatches}>
          <ul class="slds-m-top_x-small">
            <template for:each={phoneMatches} for:item="match">
              <li key={match.bookingId}>
                {match.memberName}
                <template if:true={showPick}>
                  <lightning-button
                    label="Select"
                    data-booking-id={match.bookingId}
                    data-member-name={match.memberName}
                    onclick={handlePick}
                  ></lightning-button>
                </template>
              </li>
            </template>
          </ul>
          <template if:true={showSelectedLabel}>
            <p class="slds-m-top_x-small">Selected: {selectedMemberName}</p>
          </template>
          <template if:true={canConfirm}>
            <lightning-button
              variant="brand"
              label="Confirm check-in"
              onclick={handleConfirm}
              disabled={saving}
            ></lightning-button>
          </template>
        </template>
      </div>

      <div class="slds-m-top_medium">
        <lightning-input
          label="Check-in code"
          autocomplete="off"
          value={codeInput}
          onchange={handleCodeChange}
          oncommit={handleCodeCommit}
        ></lightning-input>
        <template if:true={scanAvailable}>
          <lightning-button
            class="slds-m-top_x-small slds-m-right_x-small"
            label="Scan QR"
            onclick={handleScan}
            disabled={findingCode}
          ></lightning-button>
        </template>
        <lightning-button
          class="slds-m-top_x-small"
          label="Check in"
          variant="brand"
          onclick={handleCodeSubmit}
          disabled={findingCode}
        ></lightning-button>
        <template if:true={codeMessage}>
          <p class="slds-m-top_x-small" role="status">{codeMessage}</p>
        </template>
        <template if:true={hasCodeMatches}>
          <ul class="slds-m-top_x-small">
            <template for:each={codeMatches} for:item="match">
              <li key={match.bookingId}>
                {match.memberName}
                <lightning-button
                  label="Select"
                  data-booking-id={match.bookingId}
                  data-member-name={match.memberName}
                  onclick={handleCodePick}
                ></lightning-button>
              </li>
            </template>
          </ul>
        </template>
      </div>
    </div>
  </lightning-card>
</template>
